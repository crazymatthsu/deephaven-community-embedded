name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.name }}, Temurin 21)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          # Every step runs in bash, which on a Windows runner is Git Bash: the shell the scripts
          # of this repository have to work in there.
          - name: Windows Git Bash
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Before anything runs the wrapper: is gradle-wrapper.jar a jar that Gradle released?
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # The dependency cache is setup-java's own. gradle/actions/setup-gradle is not used: since
      # v6 its caching component comes under separate terms of use that nobody here has accepted.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: ./gradlew check
        run: ./gradlew check

      # Two instances in two processes: A from its installed distribution, B subscribing to it.
      - name: ./gradlew integrationTest
        run: ./gradlew integrationTest

      # The script has to write, on this operating system too, exactly the line that is committed.
      - name: scripts/sync-gradle-wrapper.sh leaves the wrapper as it is
        run: |
          scripts/sync-gradle-wrapper.sh
          git diff --exit-code -- gradle/wrapper/gradle-wrapper.properties

      # The installed distribution, started by its own start script in this shell.
      - name: The installed dhc-a-java starts from its start script
        run: |
          ./gradlew :apps:dhc-a-java:installDist
          scripts/check-start.sh dhc-a-java

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.name }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
