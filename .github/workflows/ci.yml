name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Linux, Temurin 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Before anything runs the wrapper: is gradle-wrapper.jar a jar that Gradle released?
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # The dependency cache is setup-java's own. gradle/actions/setup-gradle is not used: since
      # v6 its caching component comes under separate terms of use that nobody here has accepted.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: ./gradlew check
        run: ./gradlew check

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
