# Instance A and instance B as containers, from the images of ./gradlew buildImages.
#
#   docker compose -f docker/compose.yaml up -d        (or: podman compose ...)
#   scripts/smoke.sh                                   checks them, as it checks scripts/demo.sh
#   docker compose -f docker/compose.yaml down
#
# The primary pair by default: A in a plain Java host, B in Spring Boot. The secondary pair:
#   DHC_A_IMAGE=dhc/dhc-a-spring DHC_B_IMAGE=dhc/dhc-b-java docker compose -f docker/compose.yaml up -d
#
# The images hold the configuration directory. DHC_ENV picks the environment (dev unless set),
# and what is set under "environment:" below wins over the files, like any environment variable.
# Three things are fixed here whatever the environment says, because they belong to this file:
# the ports, which have to match the ones published; A's address, which is the service name; and
# the published ports stay on this machine (127.0.0.1), because dev lets anybody in.
#
# Keys, for an environment that asks for them, are passed through from the environment of the
# compose command and are never written here:
#   DHC_DHC_A_AUTH_PSK, DHC_DHC_B_AUTH_PSK, DHC_UPSTREAM_DHC_A_PSK

name: dhc

services:
  dhc-a:
    image: ${DHC_A_IMAGE:-dhc/dhc-a-java}:${DHC_IMAGE_TAG:-latest}
    environment:
      DHC_ENV: ${DHC_ENV:-dev}
      DHC_HTTP_PORT: "10000"
      DHC_WEB_PORT: "8080"
      DHC_AUTH_PSK: ${DHC_DHC_A_AUTH_PSK:-}
    ports:
      - "127.0.0.1:10000:10000" # Deephaven: web IDE and API
      - "127.0.0.1:8080:8080"   # the application's own HTTP side, if A is the Spring host

  dhc-b:
    image: ${DHC_B_IMAGE:-dhc/dhc-b-spring}:${DHC_IMAGE_TAG:-latest}
    # B waits for A by itself (DHC_UPSTREAM_CONNECT_TIMEOUT_SECONDS); this only orders the start.
    depends_on:
      - dhc-a
    environment:
      DHC_ENV: ${DHC_ENV:-dev}
      DHC_HTTP_PORT: "10001"
      DHC_WEB_PORT: "8081"
      DHC_UPSTREAM_DHC_A_URL: dh+plain://dhc-a:10000
      DHC_AUTH_PSK: ${DHC_DHC_B_AUTH_PSK:-}
      DHC_UPSTREAM_DHC_A_PSK: ${DHC_UPSTREAM_DHC_A_PSK:-}
    ports:
      - "127.0.0.1:10001:10001" # Deephaven: web IDE and API
      - "127.0.0.1:8081:8081"   # the application's own page, REST API and health
