# dhc-a-spring: Spring Boot hosting Deephaven, running role A.
# Every dhc.* value below is a default: the configuration directory overrides it, DHC_HTTP_PORT
# in the environment overrides that, and -Ddhc.http.port overrides everything.

spring.application.name=dhc-a-spring

# Spring MVC: the REST API and health.
server.port=${dhc.web.port:8080}

# The embedded Deephaven: its own server, on its own port.
dhc.app.id=dhc-a
dhc.app.modules=dhc-a
dhc.http.port=10000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# What restarts a container asks /actuator/health/liveness, what routes traffic asks
# /actuator/health/readiness. Both include the embedded Deephaven.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState,deephaven
management.endpoint.health.group.readiness.include=readinessState,deephaven
