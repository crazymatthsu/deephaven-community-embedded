<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders (dhc-b-spring)</title>
<style>
  :root { --ink: #1c2330; --muted: #5d6778; --line: #d9dee7; --page: #f5f7fa; --card: #ffffff;
          --up: #1f7a4d; --down: #b3261e; --wait: #8a6100; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
         background: var(--page); }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; padding: 18px 24px;
           background: var(--card); border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header p { margin: 0; color: var(--muted); }
  main { padding: 20px 24px 32px; display: grid; gap: 20px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
           color: #fff; background: var(--wait); }
  .badge.CONNECTED { background: var(--up); }
  .badge.DISCONNECTED { background: var(--down); }
  .numbers { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .number { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
  .number b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .number span { color: var(--muted); font-size: 13px; }
  .note { margin: 0; color: var(--down); min-height: 1.4em; }
  .tables { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .tables { grid-template-columns: 1fr; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  section h2 { margin: 0; padding: 10px 16px; font-size: 15px; font-weight: 600; border-bottom: 1px solid var(--line); }
  section h2 code { font-weight: 400; color: var(--muted); }
  iframe { display: block; width: 100%; height: 440px; border: 0; }
</style>
</head>
<body>
<header>
  <h1>Orders</h1>
  <p>Instance A's executions, as this application sees them. Feed: <span id="feed" class="badge">…</span>
     <span id="since"></span></p>
</header>
<main>
  <div class="numbers">
    <div class="number"><b id="orders">–</b><span>orders</span></div>
    <div class="number"><b id="openOrders">–</b><span>open orders</span></div>
    <div class="number"><b id="cumQty">–</b><span>filled quantity</span></div>
    <div class="number"><b id="symbols">–</b><span>symbols</span></div>
  </div>
  <p id="note" class="note"></p>
  <div class="tables">
    <section>
      <h2>Orders <code>orders_a</code></h2>
      <iframe id="orders_a" title="Orders, a live Deephaven table"></iframe>
    </section>
    <section>
      <h2>Filled quantity by symbol <code>cum_by_symbol</code></h2>
      <iframe id="cum_by_symbol" title="Filled quantity by symbol, a live Deephaven table"></iframe>
    </section>
  </div>
</main>
<script>
  // The numbers come from this application's own REST API. The two grids are Deephaven's table
  // widgets, served by the Deephaven inside this application on its own port.
  const text = (id, value) => { document.getElementById(id).textContent = value; };
  const count = value => Number(value).toLocaleString('en-US');
  let reconnects = null;
  let widgetBase = null;

  function showTables() {
    // If Deephaven asks for a key, open this page as /?psk=<key>: the page passes it on and
    // never stores it. The application does not hand the key out.
    const key = new URLSearchParams(window.location.search).get('psk');
    for (const name of ['orders_a', 'cum_by_symbol']) {
      const url = new URL(widgetBase);
      url.searchParams.set('name', name);
      if (key) url.searchParams.set('psk', key);
      document.getElementById(name).src = url;
    }
  }

  async function refresh() {
    try {
      const summary = await (await fetch('api/summary')).json();
      const feed = document.getElementById('feed');
      feed.textContent = summary.feed.state;
      feed.className = 'badge ' + summary.feed.state;
      text('since', 'since ' + new Date(summary.feed.since).toLocaleTimeString());
      text('orders', count(summary.orders));
      text('openOrders', count(summary.openOrders));
      text('cumQty', count(summary.cumQty));
      text('symbols', count(summary.bySymbol.length));
      text('note', summary.stale
          ? 'Instance A is away. These are the last numbers received; they resume when it is back.' : '');
      // After a reconnect the names refer to new tables, so the widgets are opened again.
      if (reconnects !== null && summary.feed.reconnects !== reconnects && widgetBase) showTables();
      reconnects = summary.feed.reconnects;
    } catch (e) {
      text('note', 'This application does not answer: ' + e.message);
    }
  }

  async function start() {
    const deephaven = await (await fetch('api/deephaven')).json();
    widgetBase = window.location.protocol + '//' + window.location.hostname + ':' + deephaven.port + '/iframe/widget/';
    showTables();
    await refresh();
    setInterval(refresh, 2000);
  }
  start();
</script>
</body>
</html>
