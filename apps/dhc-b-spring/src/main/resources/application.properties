# dhc-b-spring: Spring Boot hosting Deephaven, running role B.
# Every dhc.* value below is a default: DHC_HTTP_PORT in the environment overrides dhc.http.port,
# and -Ddhc.http.port overrides both.

spring.application.name=dhc-b-spring

# Spring MVC: the REST API, health and the page.
server.port=8081

# The embedded Deephaven: its own server, on its own port.
dhc.app.id=dhc-b
dhc.app.modules=dhc-b
dhc.http.port=10001

# Where instance A is. Its key, when it asks for one, is DHC_UPSTREAM_DHC_A_PSK in the
# environment and never in this file.
dhc.upstream.dhc.a.url=dh+plain://localhost:10000

# /actuator/health names its parts: deephaven, and dhc-a for the connection to A.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
